    <g transform="translate(860,100)">
      <rect width="280" height="72" rx="10" fill="url(#card)" stroke="#f0b429" stroke-width="2" filter="url(#glowEdge)"/>
      <rect x="16" y="16" width="32" height="40" rx="6" fill="#ffcc33"/>
      <rect x="20" y="20" width="24" height="32" rx="4" fill="#141a3c"/>
      <text x="60" y="34" fill="#8fa3b4" font-size="11" letter-spacing="1.1">theme</text>
      <text x="60" y="56" fill="#f4f7fa" font-size="20" font-weight="700">marquee</text>
      <text x="168" y="56" fill="#ffcc33" font-size="13">happy</text>
    </g>
    <g transform="translate(860,184)">
      <rect width="280" height="58" rx="10" fill="url(#card)" stroke="#6f8799"/>
      <rect x="16" y="12" width="32" height="34" rx="6" fill="#ff2d95"/>
      <rect x="20" y="16" width="24" height="26" rx="4" fill="#120a1e"/>
      <text x="60" y="26" fill="#8fa3b4" font-size="11" letter-spacing="1.1">theme</text>
      <text x="60" y="48" fill="#f4f7fa" font-size="16" font-weight="700">neon</text>
      <text x="128" y="48" fill="#ff2d95" font-size="12">excited</text>
    </g>
    <g transform="translate(860,254)">
      <rect width="280" height="58" rx="10" fill="url(#card)" stroke="#6f8799"/>
      <rect x="16" y="12" width="32" height="34" rx="6" fill="#ff2e3f"/>
      <rect x="20" y="16" width="24" height="26" rx="4" fill="#160608"/>
      <text x="60" y="26" fill="#8fa3b4" font-size="11" letter-spacing="1.1">theme</text>
      <text x="60" y="48" fill="#f4f7fa" font-size="16" font-weight="700">siren</text>
      <text x="128" y="48" fill="#ff2e3f" font-size="12">angry</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
