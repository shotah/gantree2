<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="pendant-mcp - face wallpaper mood">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="50%" stop-color="#1a2834"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4f60"/>
      <stop offset="100%" stop-color="#2a3a48"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d36b"/>
      <stop offset="55%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#c98412"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#4a6274"/>
      <stop offset="35%" stop-color="#1c2a38"/>
      <stop offset="100%" stop-color="#121a22"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#141a3c"/>
      <stop offset="48%" stop-color="#1c2450"/>
      <stop offset="100%" stop-color="#283064"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc33" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffcc33" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="towers" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2430"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="outBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#ffcc33"/>
    </linearGradient>
    <linearGradient id="inBubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3288"/>
      <stop offset="100%" stop-color="#2a2470"/>
    </linearGradient>
    <radialGradient id="glow" cx="56%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#f0b429" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f7fa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f4f7fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa3b4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f0b429" flood-opacity="0.4"/>
    </filter>
    <clipPath id="screen">
      <rect x="11" y="11" width="198" height="246" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="700" cy="210" rx="320" ry="180" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="52" fill="#f4f7fa" font-size="44" font-weight="700" letter-spacing="-1">pendant-mcp</text>
    <text x="74" y="76" fill="#e8a317" font-size="13" letter-spacing="2.2">FACE / WALLPAPER / MOOD / STDIO</text>
  </g>

  <g filter="url(#soft)">
    <rect x="72" y="100" width="392" height="188" rx="12" fill="url(#card)" stroke="#6f8799"/>
    <circle cx="96" cy="122" r="5" fill="#c45c4a"/>
    <circle cx="114" cy="122" r="5" fill="#f0b429"/>
    <circle cx="132" cy="122" r="5" fill="#6f8799"/>
    <text x="152" y="126" fill="#8fa3b4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">stdio</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="96" y="158" fill="#8fa3b4" font-size="13">$</text>
      <text x="112" y="158" fill="#c9d7e3" font-size="13">image__photo_generate</text>
      <text x="112" y="180" fill="#8fa3b4" font-size="12">1:1 portrait  →  face.png</text>
      <text x="96" y="208" fill="#8fa3b4" font-size="13">$</text>
      <text x="112" y="208" fill="#f4f7fa" font-size="13" font-weight="700">pendant__avatar_update</text>
      <text x="112" y="230" fill="#c9d7e3" font-size="12">source_path=face.png</text>
      <text x="96" y="258" fill="#8fa3b4" font-size="13">$</text>
      <text x="112" y="258" fill="#f0b429" font-size="13" font-weight="700">theme_update("marquee")</text>
      <rect x="310" y="246" width="8" height="13" fill="#f0b429"/>
    </g>
  </g>

  <g transform="translate(470,200)" fill="none" stroke="#f0b429" stroke-width="2">
    <path d="M0 0 C22 -6 40 -6 58 0" stroke-dasharray="4 5" opacity="0.9"/>
    <circle cx="70" cy="0" r="6.5" fill="#15202b" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="70" cy="0" r="2.4" fill="#f0b429"/>
  </g>

  <g transform="translate(572,88) rotate(-5 110 134)" filter="url(#soft)">
    <rect x="0" y="0" width="220" height="268" rx="32" fill="url(#bezel)" stroke="#f0b429" stroke-width="2.4"/>
    <rect x="7" y="7" width="206" height="254" rx="26" fill="#141a3c"/>
    <rect x="82" y="14" width="56" height="7" rx="3.5" fill="#15202b"/>

    <g clip-path="url(#screen)">
      <rect x="11" y="11" width="198" height="246" fill="url(#night)"/>
      <ellipse cx="158" cy="58" rx="28" ry="28" fill="url(#moonGlow)"/>
      <circle cx="158" cy="56" r="12" fill="#eef3f8"/>
      <circle cx="164" cy="52" r="9" fill="#0d1730"/>
      <circle cx="36" cy="40" r="1.3" fill="#f4f7fa" opacity="0.85"/>
      <circle cx="58" cy="52" r="1" fill="#f4f7fa" opacity="0.55"/>
      <circle cx="96" cy="36" r="1.1" fill="#f4f7fa" opacity="0.7"/>
      <circle cx="188" cy="78" r="1" fill="#f4f7fa" opacity="0.55"/>
      <circle cx="28" cy="72" r="0.9" fill="#f4f7fa" opacity="0.4"/>
      <circle cx="120" cy="64" r="0.8" fill="#f4f7fa" opacity="0.5"/>
      <rect x="11" y="148" width="198" height="40" fill="url(#haze)"/>
      <path d="M11 258 L11 186 L32 186 L32 154 L40 154 L40 132 L48 132 L48 154 L56 154 L56 172 L78 172 L78 148 L104 148 L104 128 L112 116 L112 148 L128 148 L128 166 L150 166 L150 140 L176 140 L176 160 L198 160 L198 176 L209 176 L209 258 Z" fill="url(#towers)" stroke="#5a7388" stroke-width="1.1"/>
      <rect x="20" y="196" width="3" height="5" fill="#f6d36b"/>
      <rect x="28" y="208" width="3" height="5" fill="#f0b429" opacity="0.7"/>
      <rect x="42" y="168" width="3" height="5" fill="#f6d36b"/>
      <rect x="42" y="186" width="3" height="5" fill="#ffcc33" opacity="0.65"/>
      <rect x="50" y="200" width="3" height="5" fill="#f6d36b" opacity="0.8"/>
      <rect x="64" y="190" width="3" height="5" fill="#f0b429"/>
      <rect x="84" y="178" width="3" height="5" fill="#f6d36b"/>
      <rect x="92" y="196" width="3" height="5" fill="#ffcc33" opacity="0.55"/>
      <rect x="100" y="184" width="3" height="5" fill="#f6d36b"/>
      <rect x="118" y="174" width="3" height="5" fill="#f6d36b"/>
      <rect x="134" y="188" width="3" height="5" fill="#f0b429" opacity="0.75"/>
      <rect x="156" y="162" width="3" height="5" fill="#f6d36b"/>
      <rect x="164" y="178" width="3" height="5" fill="#ffcc33" opacity="0.5"/>
      <rect x="184" y="186" width="3" height="5" fill="#f6d36b"/>
      <rect x="192" y="200" width="3" height="5" fill="#f0b429" opacity="0.7"/>

      <rect x="11" y="11" width="198" height="58" fill="#141a3c" opacity="0.78"/>
      <circle cx="38" cy="40" r="16" fill="#15202b"/>
      <circle cx="38" cy="36" r="6" fill="#d5e0ea"/>
      <ellipse cx="38" cy="50" rx="8.5" ry="7" fill="#d5e0ea"/>
      <circle cx="38" cy="40" r="17" fill="none" stroke="url(#gold)" stroke-width="2.3"/>
      <text x="62" y="36" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">kit</text>
      <rect x="62" y="42" width="62" height="13" rx="6.5" fill="#2a2470" stroke="#ffcc33"/>
      <text x="93" y="52" text-anchor="middle" fill="#ffcc33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" letter-spacing="0.6">MARQUEE</text>

      <rect x="22" y="84" width="148" height="34" rx="11" fill="url(#inBubble)" stroke="#7a84b8"/>
      <text x="34" y="105" fill="#fff8e6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">opening night!</text>

      <rect x="72" y="128" width="126" height="38" rx="11" fill="url(#outBubble)"/>
      <text x="84" y="144" fill="#1a1606" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700">marquee · gold bulbs</text>
      <text x="84" y="158" fill="#3a2a08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">face + wallpaper on</text>

      <rect x="88" y="246" width="44" height="4" rx="2" fill="#f4f7fa" opacity="0.3"/>
