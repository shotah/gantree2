name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it.

  - type: input
    id: version
    attributes:
      label: StravaMCP Version
      description: "Run `strava-mcp --version` and paste the output"
      placeholder: "v1.2.0 (commit abc1234, built 2026-04-05)"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - "go install"
        - Homebrew
        - Binary download
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (amd64)
        - Linux (arm64)
        - Other
    validations:
      required: true

  - type: input
    id: mcp-client
    attributes:
      label: MCP Client
      description: "Which MCP client are you using?"
      placeholder: "Claude Desktop, Cursor, Claude Code, etc."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "A clear description of the bug"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Minimal steps to trigger the bug"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: "Run with `--debug` and paste relevant stderr output. Redact any tokens or secrets."
      render: text
    validations:
      required: false
