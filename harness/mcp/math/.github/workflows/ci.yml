name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/mcp-go-math .

      - name: Version + self-test
        run: |
          ./bin/mcp-go-math --version
          ./bin/mcp-go-math --self-test

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Test
        run: go test ./... -count=1 -timeout 5m

      - name: Coverage (≥70%)
        run: |
          go test ./... -count=1 "-coverprofile=coverage.out"
          total=$(go tool cover "-func=coverage.out" | awk '/^total:/ {print $3}' | tr -d '%')
          awk -v t="$total" 'BEGIN {
            if (t+0 < 70) { printf "coverage %.1f%% is below 70%%\n", t; exit 1 }
            printf "coverage %.1f%% ok\n", t
          }'
