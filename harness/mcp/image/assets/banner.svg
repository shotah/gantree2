<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="image-generation-mcp - prompt to PNG">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15202b"/>
      <stop offset="55%" stop-color="#1c2a38"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4f60"/>
      <stop offset="100%" stop-color="#2a3a48"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef3"/>
      <stop offset="100%" stop-color="#b7c7d4"/>
    </linearGradient>
    <linearGradient id="photoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7a90"/>
      <stop offset="100%" stop-color="#2a4152"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5366"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#e8a317"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d36b"/>
      <stop offset="100%" stop-color="#e8a317"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="46%" r="34%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f6d36b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f6d36b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa3b4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="brick" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#4a241c"/>
      <rect x="1" y="1" width="16" height="7" fill="#9a5644"/>
      <rect x="19" y="1" width="16" height="7" fill="#7d4336"/>
      <rect x="-8" y="10" width="16" height="7" fill="#86503c"/>
      <rect x="10" y="10" width="16" height="7" fill="#a35d48"/>
      <rect x="28" y="10" width="16" height="7" fill="#8f4d3d"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="shot">
      <rect x="16" y="16" width="276" height="168" rx="2"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="940" cy="210" rx="300" ry="168" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="56" fill="#f4f7fa" font-size="46" font-weight="700" letter-spacing="-1">image-generation-mcp</text>
    <text x="82" y="84" fill="#e8a317" font-size="15" letter-spacing="2.4">PROMPT TO PNG / STDIO / SWAP THE BACKEND</text>
  </g>

  <g filter="url(#soft)">
    <rect x="80" y="154" width="420" height="132" rx="10" fill="url(#card)" stroke="#6f8799"/>
    <circle cx="104" cy="176" r="5" fill="#c45c4a"/>
    <circle cx="122" cy="176" r="5" fill="#f0b429"/>
    <circle cx="140" cy="176" r="5" fill="#6f8799"/>
    <text x="160" y="180" fill="#8fa3b4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">prompt</text>
    <text x="104" y="222" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">a red bicycle leaning</text>
    <text x="104" y="250" fill="#c9d7e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">on a brick wall</text>
    <rect x="104" y="260" width="9" height="14" fill="#f0b429"/>
  </g>

  <g transform="translate(546,206)" filter="url(#soft)">
    <rect x="-30" y="-18" width="60" height="44" rx="8" fill="#3a4f60" stroke="#f0b429" stroke-width="2"/>
    <rect x="-8" y="-28" width="16" height="12" rx="3" fill="#3a4f60" stroke="#f0b429" stroke-width="2"/>
    <circle r="13" fill="#15202b" stroke="url(#gold)" stroke-width="3"/>
    <circle r="5" fill="#f0b429" opacity="0.85"/>
    <circle cx="18" cy="-10" r="3" fill="#c9d7e3"/>
  </g>

  <g transform="translate(676,108) rotate(-5 154 114)" filter="url(#soft)">
    <rect width="308" height="228" rx="8" fill="url(#frame)" stroke="#f0b429" stroke-width="2"/>
    <g clip-path="url(#shot)">
      <rect x="16" y="16" width="276" height="168" fill="url(#photoSky)"/>
      <rect x="16" y="40" width="276" height="116" fill="url(#brick)"/>
      <rect x="16" y="148" width="276" height="36" fill="#6d8498"/>
      <rect x="16" y="148" width="276" height="4" fill="#9fb3c5"/>
      <rect x="36" y="86" width="28" height="62" rx="2" fill="#2a1c18" stroke="#c9d7e3" stroke-width="2"/>
      <circle cx="58" cy="118" r="2" fill="#f0b429"/>
      <ellipse cx="220" cy="78" rx="54" ry="40" fill="url(#lamp)"/>
      <rect x="186" y="48" width="68" height="58" fill="#243746" stroke="#e8eef3" stroke-width="3"/>
      <rect x="191" y="53" width="27" height="22" fill="url(#pane)"/>
      <rect x="222" y="53" width="27" height="22" fill="url(#pane)"/>
      <rect x="191" y="79" width="27" height="22" fill="#e8a317"/>
      <rect x="222" y="79" width="27" height="22" fill="#f0b429"/>
      <ellipse cx="118" cy="170" rx="86" ry="8" fill="#15202b" opacity="0.45"/>
      <g transform="translate(42,72) rotate(-30 78 78)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="40" cy="86" r="24" stroke="#f4f7fa" stroke-width="4.5"/>
        <circle cx="40" cy="86" r="7" stroke="#c9d7e3" stroke-width="2"/>
        <circle cx="138" cy="86" r="24" stroke="#f4f7fa" stroke-width="4.5"/>
        <circle cx="138" cy="86" r="7" stroke="#c9d7e3" stroke-width="2"/>
        <path d="M40 86 L80 86 L82 34 L126 36 L138 86" stroke="#c45c4a" stroke-width="5.5"/>
        <path d="M80 86 L126 36" stroke="#c45c4a" stroke-width="5.5"/>
        <path d="M82 34 L82 18 M68 18 L98 16" stroke="#c45c4a" stroke-width="4.5"/>
        <path d="M126 36 L132 14 L156 10" stroke="#c45c4a" stroke-width="4.5"/>
        <path d="M72 86 L90 102" stroke="#c45c4a" stroke-width="3.5"/>
      </g>
    </g>
    <text x="154" y="212" text-anchor="middle" fill="#15202b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="4">PNG</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <g transform="translate(80,338)">
      <rect width="168" height="28" rx="6" fill="#3f5870" stroke="#f0b429"/>
      <text x="84" y="19" text-anchor="middle" fill="#f4f7fa">photo_generate</text>
    </g>
    <g transform="translate(264,338)">
      <rect width="140" height="28" rx="6" fill="#3f5870" stroke="#f0b429"/>
      <text x="70" y="19" text-anchor="middle" fill="#f4f7fa">photo_edit</text>
    </g>
    <g transform="translate(420,338)">
      <rect width="200" height="28" rx="6" fill="#3a4f60" stroke="#6f8799"/>
      <text x="100" y="19" text-anchor="middle" fill="#c9d7e3">IMAGE_API_KEY</text>
    </g>
  </g>
</svg>
