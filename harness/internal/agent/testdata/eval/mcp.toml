# Live MCP catalogs for the behavioral eval — docs/eval_setup.md.
#
# A fixture with `tools_from = ["rentals"]` gets that server's real tool
# names, descriptions, and schemas at run time: the integration test
# builds the sibling module named in harness/mcp.lock and the host boots
# it over stdio. tools/list is the contract. Nothing is called — results
# stay canned — so the env values below only satisfy each binary's
# startup check. A sibling module that renames a tool fails the fixture
# before any model call.
#
# flights-search-mcp is not in this repo (no mcp.lock row). The denver
# flight fixture does not list `flights` in tools_from; those tools stay
# canned in the fixture. Binaries land in a fresh temp directory unless
# EVAL_MCP_BIN already holds them (CI prebuilds there).

[[server]]
name    = "rentals"
command = "rentals-search-mcp"
env     = ["RENTCAST_API_KEY=eval-placeholder"]

# Google publishes ~100 tools; a real deploy runs a tier or an allowlist.
# The eval takes list plus the batch create. A single event is a one-element
# list; there is no singular create.
[[server]]
name    = "google"
command = "google-mcp"
tools   = ["calendar_list_events", "calendar_create_events"]
