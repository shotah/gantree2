# mcp.lock — one plugin per line, tab-separated.
# id	path	module	binary	needs	[home_only]
# path is relative to harness/. needs is the comma-separated required env keys, or -.
# Not carried from ai-gantry (2026-10-10): youtube, boards, cast (mcp-beam),
# search (gemini-google-search; web_search is a harness builtin). gantry-fleet
# was never a plugin.
math	./mcp/math	github.com/shotah/mcp-go-math	mcp-go-math	-
maps	./mcp/maps	github.com/shotah/google-maps-mcp	google-maps-mcp	GOOGLE_MAPS_API_KEY
image	./mcp/image	github.com/shotah/image-generation-mcp	image-generation-mcp	-
chat	./mcp/chat	github.com/shotah/pendant-mcp	chat	-
google	./mcp/google	github.com/shotah/google-mcp	google-mcp	GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET
google-health	./mcp/google-health	github.com/shotah/google-health-mcp	google-health-mcp	GOOGLE_HEALTH_CLIENT_ID,GOOGLE_HEALTH_CLIENT_SECRET
garmin	./mcp/garmin	github.com/shotah/go-garmin	garmin	GARMIN_EMAIL,GARMIN_PASSWORD
strava	./mcp/strava	github.com/shotah/go-strava-mcp	strava-mcp	STRAVA_CLIENT_ID,STRAVA_CLIENT_SECRET
feeds	./mcp/feeds	github.com/shotah/feeds-mcp	feeds-mcp	FEEDS_USER_AGENT
twitter	./mcp/twitter	github.com/shotah/twitter-mcp	twitter-mcp	X_BEARER_TOKEN
rentals	./mcp/rentals	github.com/shotah/rentals-search-mcp	rentals-search-mcp	RENTCAST_API_KEY
flights	./mcp/flights	github.com/shotah/flights-search-mcp	flights-search-mcp	SERPAPI_API_KEY
