name: pages

# Builds the static site (home, docs, oauth-catch, privacy) and publishes it
# to gh-pages beside the coverage badge. Additive: only the site's own paths
# are replaced, so the ci.yml badge survives and vice versa.
#
# Pages source: branch gh-pages / (root). Enable once in Settings → Pages,
# then "Enforce HTTPS" — the oauth-catch page needs a secure context to copy.
#
# The site lives at github.bldhosting.com (CNAME on gh-pages; the DNS CNAME
# points at shotah.github.io). Optional repository variables:
#   PAGES_CUSTOM_DOMAIN       → another host for a fork (default github.bldhosting.com)
#   GOOGLE_SITE_VERIFICATION  → Search Console HTML-tag token, injected into index.html

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/**"
      - "scripts/pages.mjs"
      - "scripts/publish-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    # contents:write — push the site to gh-pages.
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run pages

      - name: Site verification + custom domain
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN || 'github.bldhosting.com' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          if [ -n "${GOOGLE_SITE_VERIFICATION}" ]; then
            sed -i "s|</title>|</title>\n  <meta name=\"google-site-verification\" content=\"${GOOGLE_SITE_VERIFICATION}\">|" dist/pages/index.html
          fi
          printf '%s\n' "${PAGES_CUSTOM_DOMAIN}" > dist/pages/CNAME

      - name: Publish site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish-pages.sh
          PAIRS=(
            dist/pages/index.html:index.html
            dist/pages/404.html:404.html
            dist/pages/style.css:style.css
            dist/pages/docs:docs
            dist/pages/assets:assets
            dist/pages/oauth-catch:oauth-catch
            dist/pages/privacy:privacy
            dist/pages/CNAME:CNAME
          )
          scripts/publish-pages.sh "chore: site [skip ci]" "${PAIRS[@]}"
