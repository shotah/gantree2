name: deploy-cloudflare

# Deploy the Worker to Cloudflare after ci passes on main.
#
# Repository → Settings → Secrets and variables → Actions:
#   Variables: GOOGLE_CLIENT_ID, GANTREE_ADMINS, GANTREE_ALLOW
#   Secrets:   GOOGLE_CLIENT_SECRET, SESSION_SECRET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Home (celld) does not use this file: `npm run deploy:home` with CELLD_VARS_FILE.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Fail fast on missing config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GANTREE_ADMINS: ${{ vars.GANTREE_ADMINS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          for k in GOOGLE_CLIENT_ID GANTREE_ADMINS GOOGLE_CLIENT_SECRET SESSION_SECRET; do
            [ -n "${!k}" ] || { echo "missing $k" >&2; exit 1; }
          done

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var GOOGLE_CLIENT_ID:"${{ vars.GOOGLE_CLIENT_ID }}" \
            --var GANTREE_ADMINS:"${{ vars.GANTREE_ADMINS }}" \
            --var GANTREE_ALLOW:"${{ vars.GANTREE_ALLOW }}"

      - name: wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({GOOGLE_CLIENT_SECRET:process.env.GOOGLE_CLIENT_SECRET,SESSION_SECRET:process.env.SESSION_SECRET}))' \
            | npx wrangler secret bulk
