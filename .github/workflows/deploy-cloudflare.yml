name: deploy-cloudflare

# Deploy the Worker to Cloudflare after ci passes on main.
#
# Repository → Settings → Secrets and variables → Actions:
#   Variables: GOOGLE_CLIENT_ID, GANTREE_ADMINS, GANTREE_ALLOW
#   Secrets:   GOOGLE_CLIENT_SECRET, SESSION_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables (optional): VAPID_SUBJECT
#
# Home (celld) does not use this file: `npm run deploy:home` with CELLD_VARS_FILE.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Fail fast on missing config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GANTREE_ADMINS: ${{ vars.GANTREE_ADMINS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          for k in GOOGLE_CLIENT_ID GANTREE_ADMINS GOOGLE_CLIENT_SECRET SESSION_SECRET; do
            [ -n "${!k}" ] || { echo "missing $k" >&2; exit 1; }
          done

      # wrangler.jsonc ships with the KV id as "TODO" so a fork has nothing to
      # scrub. Create the namespace and bucket once (idempotent) and patch
      # the real id in for this run only; the file in git stays generic.
      # Every account-level name is `gantree2-*`: the same account runs the
      # originals (Worker `gantree`, pendant's KV `DIRECTORY`), and a bare
      # name collides with them or, worse, shares their data.
      - name: Provision KV + R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          KV_TITLE="gantree2-directory"
          # `wrangler kv namespace list` prints a banner, then a JSON array.
          # Match the title as given or prefixed with the Worker name, since
          # wrangler versions differ on whether `create` adds the prefix.
          kv_id() {
            npx wrangler kv namespace list | node -e '
              const want = process.argv[1];
              const text = require("fs").readFileSync(0, "utf8");
              const rows = JSON.parse(text.slice(text.indexOf("[")));
              const hit = rows.find((r) => r.title === want || r.title === `gantree2-${want}`);
              process.stdout.write(hit ? hit.id : "");
            ' "$KV_TITLE"
          }
          id=$(kv_id)
          if [ -z "$id" ]; then
            npx wrangler kv namespace create "$KV_TITLE" >/dev/null
            id=$(kv_id)
            echo "created KV namespace $KV_TITLE"
          fi
          [ -n "$id" ] || { echo "no KV namespace id for $KV_TITLE" >&2; exit 1; }
          sed -i "s/\"binding\": \"DIRECTORY\", \"id\": \"TODO\"/\"binding\": \"DIRECTORY\", \"id\": \"$id\"/" wrangler.jsonc
          grep -q "\"id\": \"$id\"" wrangler.jsonc || { echo "KV id not patched" >&2; exit 1; }
          npx wrangler r2 bucket list | grep -qw "gantree2-store" \
            || npx wrangler r2 bucket create gantree2-store

      # Build AFTER provisioning. vinext writes dist/server/wrangler.json and
      # a .wrangler/deploy/config.json redirect, and `wrangler deploy` reads
      # that generated copy — so it must be generated from the patched file,
      # or it ships the literal "TODO" id.
      - run: npm run build

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var GOOGLE_CLIENT_ID:"${{ vars.GOOGLE_CLIENT_ID }}" \
            --var GANTREE_ADMINS:"${{ vars.GANTREE_ADMINS }}" \
            --var GANTREE_ALLOW:"${{ vars.GANTREE_ALLOW }}" \
            --var VAPID_SUBJECT:"${{ vars.VAPID_SUBJECT }}"

      # Push secrets are optional: chat works without web push. Only non-empty values are sent.
      - name: wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node -e '
            const names = ["GOOGLE_CLIENT_SECRET", "SESSION_SECRET", "VAPID_PUBLIC_KEY", "VAPID_PRIVATE_KEY"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            process.stdout.write(JSON.stringify(out));
          ' | npx wrangler secret bulk
