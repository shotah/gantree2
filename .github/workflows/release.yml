name: release

# GitHub Release for every v* tag, with generated notes. Tags come from
# `npm run release` (scripts/release.mjs). A tag with a `-` (v1.2.0-rc1) is
# marked pre-release; anything else becomes the latest release.
#
# TODO(2026-10-11, release-gate): re-add the eval job as a gate once the fixture set is stable — see docs/ci.md
# eval.yml listens for the same v* tag and runs beside this. It does not
# block the release. Deploys are not here: deploy-cloudflare.yml follows
# ci on main.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "${extra[@]}"
