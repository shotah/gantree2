name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    # contents:write — push badges/coverage.svg to gh-pages on main.
    permissions:
      contents: write
    # Serialize gh-pages writers across workflows.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # scripts/icons.ts rasters the banner with DejaVu Sans (test/scripts/icons.test.ts runs it).
      - name: DejaVu fonts
        run: ls /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      # Thresholds live in vitest.config.ts; a drop below them fails here.
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-app
          path: coverage/coverage-summary.json

      - name: Coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/badge.mjs vitest coverage/coverage-summary.json badges/coverage.svg

      # gh-pages hosts:
      #   badges/coverage.svg          → README "coverage" badge (this job)
      # Pages source: branch gh-pages / (root). Enable once in Settings → Pages.
      - name: Publish badge to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish-pages.sh
          scripts/publish-pages.sh "chore: app coverage badge [skip ci]" \
            badges/coverage.svg:badges/coverage.svg
