name: scorecard

# OpenSSF Scorecard. publish_results writes the public score once this
# file is on main. Weekly, plus a push to main, plus branch_protection_rule
# so Branch-Protection and Maintained stay current.
# The job stays inside the action list the publisher accepts.

on:
  branch_protection_rule:
  schedule:
    - cron: "20 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Checkout, and the scorecard reading workflow runs.
      contents: read
      actions: read
      # publish_results signs the result with the OIDC token.
      id-token: write
      # SARIF upload to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
