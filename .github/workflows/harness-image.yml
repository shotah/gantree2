name: harness-image

# Builds harness/Dockerfile and smokes it. Neither deploy target pulls from
# GHCR — `wrangler deploy` and celld build this same Dockerfile themselves —
# so the push is the public prebuilt image and the release artifact:
#   main   → ghcr.io/shotah/gantree-harness:<sha>
#   vX.Y.Z → ghcr.io/shotah/gantree-harness:vX.Y.Z and :latest
# (`npm run release` pushes the tag; paths filters are not evaluated for
# tag pushes, so every release builds.)
# The image ENTRYPOINT is already /usr/local/bin/gantry (distroless, no shell).
# `gantry version` is the command; `--version` is not a flag, and a bare
# `docker run <image> gantry --version` would exec `gantry gantry --version`.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "harness/**"
      - ".github/workflows/harness-image.yml"
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f harness/Dockerfile -t gantree-harness harness/

      - name: Smoke
        run: docker run --rm --entrypoint /usr/local/bin/gantry gantree-harness version

      - name: Push to GHCR
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gantree-harness"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$REF_NAME latest"
          else
            tags="$SHA"
          fi
          for tag in $tags; do
            docker tag gantree-harness "$image:$tag"
            docker push "$image:$tag"
          done
