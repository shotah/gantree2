name: eval

# Behavioral eval against a live model (docs/eval_setup.md). Paid, so not
# on every push: release.yml calls this workflow on a v* tag, and it can
# be run by hand. LLM_BASE_URL, LLM_API_KEY, and LLM_MODEL are repository
# secrets. When any is absent the job prints a notice and succeeds, so a
# fork without them still releases. Secret values are never written to
# the log.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per fixture (every run must pass)"
        default: "3"
      only:
        description: "Run only this fixture name (blank = all)"
        default: ""
  workflow_call:
    inputs:
      runs:
        description: "Runs per fixture (every run must pass)"
        type: string
        default: "3"
        required: false
      only:
        description: "Run only this fixture name (blank = all)"
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  eval:
    name: Live model eval
    runs-on: ubuntu-latest
    # A turn is slow; thirty fixtures × 3 runs can outlast an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: LLM secrets present?
        id: llm
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${LLM_BASE_URL:-}" ] || missing+=(LLM_BASE_URL)
          [ -n "${LLM_API_KEY:-}" ] || missing+=(LLM_API_KEY)
          [ -n "${LLM_MODEL:-}" ] || missing+=(LLM_MODEL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::live eval skipped; missing repository secrets: ${missing[*]}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.llm.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.llm.outputs.run == 'true'
        run: npm ci

      - name: Eval fixtures against the model
        if: steps.llm.outputs.run == 'true'
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EVAL_N: ${{ inputs.runs || '3' }}
          EVAL_ONLY: ${{ inputs.only || '' }}
        run: npm run eval
