name: eval

# Behavioral eval against a live model (docs/eval_setup.md). Paid, so not
# on every push: release.yml calls this workflow on a v* tag, and it can
# be run by hand. LLM_BASE_URL, LLM_API_KEY, and LLM_MODEL are repository
# secrets. When any is absent the job prints a notice and succeeds, so a
# fork without them still releases. Secret values are never written to
# the log. Sibling plugins named by tools_from are built here; the test
# reuses them via EVAL_MCP_BIN instead of downloading a release.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per fixture (every run must pass)"
        default: "3"
      only:
        description: "Run only this fixture name (blank = all)"
        default: ""
  workflow_call:
    inputs:
      runs:
        description: "Runs per fixture (every run must pass)"
        type: string
        default: "3"
        required: false
      only:
        description: "Run only this fixture name (blank = all)"
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  eval:
    name: Live model eval
    runs-on: ubuntu-latest
    # ~15s a turn; the full fixture set x 3 runs is well under an hour,
    # including the sibling plugin builds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: LLM secrets present?
        id: llm
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${LLM_BASE_URL:-}" ] || missing+=(LLM_BASE_URL)
          [ -n "${LLM_API_KEY:-}" ] || missing+=(LLM_API_KEY)
          [ -n "${LLM_MODEL:-}" ] || missing+=(LLM_MODEL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::live eval skipped; missing repository secrets: ${missing[*]}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.llm.outputs.run == 'true'
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: |
            harness/go.sum
            harness/mcp/flights/go.sum
            harness/mcp/google/go.sum
            harness/mcp/rentals/go.sum

      - name: Build sibling plugins
        if: steps.llm.outputs.run == 'true'
        working-directory: harness
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/gantry-eval-mcp"
          mkdir -p "$out"
          (cd mcp/rentals && CGO_ENABLED=0 go build -o "$out/rentals-search-mcp" ./cmd/rentals-search-mcp)
          (cd mcp/flights && CGO_ENABLED=0 go build -o "$out/flights-search-mcp" ./cmd/flights-search-mcp)
          (cd mcp/google && CGO_ENABLED=0 go build -o "$out/google-mcp" .)
          echo "EVAL_MCP_BIN=${out}" >> "$GITHUB_ENV"

      - name: Eval fixtures against the model
        if: steps.llm.outputs.run == 'true'
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EVAL_N: ${{ inputs.runs || '3' }}
          EVAL_ONLY: ${{ inputs.only || '' }}
        run: |
          set -euo pipefail
          make -C harness integration-test EVAL_ARGS="-eval.n=${EVAL_N} -eval.only=${EVAL_ONLY}"
