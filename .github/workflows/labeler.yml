name: labeler

# Labels from .github/labeler.yml. pull_request_target so a fork can be
# labeled. This job does not check out the pull request. The labels it
# applies have to exist already (issues: write is not granted here).

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
