name: labeler

# Labels from .github/labeler.yml. pull_request_target so a fork can be
# labeled. This job does not check out the pull request. The labels it
# applies have to exist already (issues: write is not granted here).

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
