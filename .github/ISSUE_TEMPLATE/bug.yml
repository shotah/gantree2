name: Bug
description: Something broke in a running assistant, the door, or the brain.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        What you did, what you saw, what you expected. One bug.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Route, plugin, tool name (`plugin__tool`), or file.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, tag, or main.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: What came back
      description: Redact keys, cookies, and tokens before pasting.
      render: text
    validations:
      required: false
