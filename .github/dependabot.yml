version: 2
updates:
  # One pull request for npm minor and patch. Each major stays its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # typescript-eslint@8 peers typescript >=4.8.4 <6.1.0. A typescript
    # major (7.x) fails npm ci with ERESOLVE. Minors and patches stay
    # in the group above.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
