<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e1316" />
  <title>Authorization code — gantree</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
  <style>
    :root {
      --canvas: #0e1316;
      --panel: #171d22;
      --track: #232b32;
      --line: #3a4550;
      --fg: #f4f0ea;
      --muted: #9aa3ab;
      --accent: #f07848;
      --accent-line: #c24a28;
      --ok: #3db8a0;
      --danger: #e070a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      background: var(--canvas);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      width: min(32rem, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; font-weight: 600; }
    p { color: var(--muted); line-height: 1.45; margin: 0 0 1rem; }
    code { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.95rem;
      word-break: break-all;
      background: var(--canvas);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin: 0 0 1rem;
      min-height: 3rem;
      color: var(--fg);
    }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    button {
      appearance: none;
      border: 1px solid var(--accent-line);
      border-radius: 8px;
      padding: 0.65rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--canvas);
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: var(--track); color: var(--fg); border-color: var(--line); }
    .status { margin-top: 0.85rem; min-height: 1.25rem; color: var(--ok); font-size: 0.9rem; }
    .err { color: var(--danger); }
    a { color: var(--accent); }
    .foot { margin-top: 1.25rem; margin-bottom: 0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Authorization code</h1>
    <p>
      Copy this code and paste it to your agent as
      <code>/auth &lt;server&gt; &lt;code&gt;</code>.
      This page stores nothing — it only shows what the provider put in the URL.
    </p>
    <div id="code" class="code" aria-live="polite">Looking for <code>?code=</code>…</div>
    <div class="row">
      <button type="button" id="copy" disabled>Copy code</button>
      <button type="button" class="secondary" id="clear" disabled>Clear from URL</button>
    </div>
    <div id="status" class="status"></div>
    <p class="foot">
      Guide: <a href="../docs/auth.html">connecting accounts</a> ·
      <a href="../privacy/">privacy</a> ·
      <a href="../">gantree</a>
    </p>
  </main>
  <script>
    (function () {
      // navigator.clipboard only exists in a secure context. If we were reached over
      // plain http (e.g. a Pages redirect before "Enforce HTTPS"), hop to https with
      // the query string intact so the copy button works.
      function httpsUpgradeUrl(loc) {
        if (loc.protocol !== "http:") { return null; }
        if (loc.hostname === "localhost" || loc.hostname === "127.0.0.1") { return null; }
        return "https://" + loc.host + loc.pathname + loc.search;
      }
      window.__httpsUpgradeUrl = httpsUpgradeUrl;
      var upgrade = httpsUpgradeUrl(window.location);
      if (upgrade) {
        window.location.replace(upgrade);
        return;
      }

      var params = new URLSearchParams(window.location.search);
      var code = params.get("code") || "";
      var err = params.get("error") || "";
      var el = document.getElementById("code");
      var status = document.getElementById("status");
      var copyBtn = document.getElementById("copy");
      var clearBtn = document.getElementById("clear");

      if (err) {
        el.textContent = "";
        status.className = "status err";
        status.textContent = "Provider error: " + err + (params.get("error_description") ? " — " + params.get("error_description") : "");
        return;
      }
      if (!code) {
        el.textContent = "No code in this URL. Start again with /auth <server> in chat.";
        return;
      }
      el.textContent = code;
      copyBtn.disabled = false;
      clearBtn.disabled = false;

      function selectCode() {
        var range = document.createRange();
        range.selectNodeContents(el);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function copied() {
        status.className = "status";
        status.textContent = "Copied — paste it to your agent now.";
      }

      function copyFailed() {
        selectCode();
        status.className = "status err";
        status.textContent = "Copy blocked by the browser — the code is selected, press Ctrl/Cmd+C.";
      }

      // Fallback for browsers without the async Clipboard API (or insecure contexts).
      function legacyCopy() {
        var ta = document.createElement("textarea");
        ta.value = code;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      copyBtn.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(copied, function () {
            if (legacyCopy()) { copied(); } else { copyFailed(); }
          });
          return;
        }
        if (legacyCopy()) { copied(); } else { copyFailed(); }
      });

      clearBtn.addEventListener("click", function () {
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        status.className = "status";
        status.textContent = "Query string cleared from the address bar.";
      });

      // Best-effort: strip code from history after a moment so a shared screen is safer.
      setTimeout(function () {
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, 500);
    })();
  </script>
</body>
</html>
